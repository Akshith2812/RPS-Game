<!DOCTYPE html>
<html>
  <head>
   <title>Rock Paper Scissors</title>

   <link rel="stylesheet"  href="styles/rock-paper-scissors.css">
  </head>

  <body>
    <p class="title">Rock Paper Scissors Game</p>

    <div class="game-container">
    <button onclick="
      playGame('rock');
    " class="move-button"><img class="move-icon" src="images/rock-emoji.png"></button>

    <button onclick="
      playGame('paper');
    " class="move-button"><img class="move-icon" src="images/paper-emoji.png"></button>

    <button onclick="
      playGame('scissors');
    " class="move-button"><img class="move-icon" src="images/scissors-emoji.png"></button>
    </div>


    <p class="js-result"></p>
    <p class="js-moves"></p>

    <div class="score">
      <p class="js-score"></p>


      <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
      " class="reset-button">Reset Score</button>
    </div>
   


    <script src="scripts/rock-paper-scissors.js"></script>
  </body>
</html>
